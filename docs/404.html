<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>页面不存在 · loomgrid-tariffs</title>
<meta name="theme-color" content="#08090B">
<style>
:root{--void:#08090B;--ink:#EDECE8;--ash1:rgba(237,236,232,.58);--ash2:rgba(237,236,232,.52);--ash3:rgba(237,236,232,.32);--gold:#C9A227;--line:rgba(237,236,232,.10)}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--void);color:var(--ink);font-family:"PingFang SC","Microsoft YaHei",-apple-system,sans-serif;line-height:1.62;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.box{max-width:480px;width:100%}
.code{font-family:ui-monospace,Consolas,monospace;font-size:clamp(64px,14vw,104px);font-weight:300;letter-spacing:-.05em;line-height:1;color:var(--ash3)}
h1{font-size:22px;font-weight:500;letter-spacing:-.02em;margin:16px 0 12px}
p{font-size:14px;color:var(--ash1);line-height:1.8;max-width:44ch}
a{display:inline-block;margin-top:26px;font-size:14px;color:var(--ink);padding-bottom:5px;border-bottom:1px solid var(--ash3);text-decoration:none;transition:border-color .22s,color .22s}
a:hover{border-bottom-color:var(--gold);color:var(--gold)}
.rule{height:1px;background:var(--line);margin:28px 0 0;position:relative}
.rule::before{content:"";position:absolute;left:0;top:-11px;width:1px;height:23px;background:rgba(201,162,39,.42)}
</style>
</head>
<body>
<div class="box">
  <div class="code">404</div>
  <h1>这个地址没有东西</h1>
  <p>可能是链接写错了，或者数据文件被移动过。回到首页可以查 33 个省级行政区的分时电价。</p>
  <a href="/loomgrid-tariffs/">回到数据集首页</a>
  <div class="rule"></div>
</div>
</body>
</html>
