name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # validate.py 与 scripts/ 只用标准库，无需安装依赖
      - name: Validate dataset
        run: python validate.py

      - name: Compile-check scripts
        run: |
          python -m py_compile scripts/check_proxy_price.py
          echo "scripts 语法检查通过"
